<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Drawer Cabinetry — 2026 Org Chart</title>
<style>
  :root{
    --canvas:#06070a;
    --grid:rgba(255,255,255,.035);
    --card:#13161d;
    --card-2:#171b23;
    --line:#2b3340;
    --conn:#34404f;
    --text:#eef1f6;
    --muted:#94a0b2;
    --red:#e0231f;
    --red-dk:#b81b18;
    --exec:#e0231f;
    --finance:#3b82f6;
    --marketing:#a855f7;
    --sales:#10b981;
    --ops:#f59e0b;
    --shadow:0 10px 34px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--canvas);color:var(--text);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }

  /* White branded header */
  header.top{background:#fff;color:#15171c;flex:0 0 auto;z-index:30;box-shadow:0 2px 14px rgba(0,0,0,.4)}
  .redbar{height:6px;background:linear-gradient(90deg,var(--red),var(--red-dk))}
  .headpad{padding:16px 26px 14px}
  .brandrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{width:54px;height:54px;flex:0 0 auto;filter:drop-shadow(0 3px 8px rgba(224,35,31,.28))}
  .brandtext h1{margin:0;font-size:19px;font-weight:800;color:#15171c}
  .brandtext p{margin:2px 0 0;color:#6b7280;font-size:12.5px;font-weight:500}
  .brandtext .accent{color:var(--red);font-weight:700}
  .spacer{flex:1}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .btn{background:#fff;border:1.5px solid #e2e4ea;color:#15171c;padding:7px 13px;border-radius:8px;font-size:13px;cursor:pointer;transition:.15s;font-weight:600}
  .btn:hover{border-color:var(--red);color:var(--red)}
  .btn.primary{background:var(--red);border-color:var(--red);color:#fff}
  .btn.primary:hover{background:var(--red-dk);border-color:var(--red-dk)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .legend span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6b7280;font-weight:500}
  .dot{width:10px;height:10px;border-radius:50%}

  /* Canvas */
  .canvas{
    flex:1 1 auto;position:relative;overflow:auto;cursor:grab;
    background-color:var(--canvas);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:46px 46px;
  }
  .canvas.grabbing{cursor:grabbing}
  .canvas::-webkit-scrollbar{width:12px;height:12px}
  .canvas::-webkit-scrollbar-thumb{background:#222833;border-radius:8px;border:3px solid var(--canvas)}
  .stage{padding:48px 80px 120px;display:inline-block;min-width:100%;transform-origin:50% 0}

  /* Tree (top-down with elbow connectors) */
  .tree, .tree ul{position:relative;margin:0;padding:0;list-style:none}
  .tree ul{display:flex;justify-content:center;padding-top:52px}
  .tree li{position:relative;padding:52px 14px 0;display:flex;flex-direction:column;align-items:center}
  /* connectors — tick height (28) stops at the top edge of the avatar bubble */
  .tree li::before,.tree li::after{content:'';position:absolute;top:0;width:50%;height:28px;border-top:2px solid var(--conn)}
  .tree li::before{right:50%}
  .tree li::after{left:50%;border-left:2px solid var(--conn)}
  .tree li:first-child::before,.tree li:last-child::after{border:0 none}
  .tree li:last-child::before{border-right:2px solid var(--conn)}
  .tree>li{padding-top:0}
  .tree>li::before,.tree>li::after{display:none}
  .tree ul::before{content:'';position:absolute;top:0;left:50%;height:52px;border-left:2px solid var(--conn)}
  .tree li.collapsed>ul{display:none}

  /* Node card */
  .card{
    position:relative;z-index:1;width:196px;background:linear-gradient(180deg,var(--card-2),var(--card));
    border:1px solid var(--line);border-radius:14px;padding:30px 12px 16px;cursor:pointer;
    transition:.16s;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .card .avatar{
    position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:15px;color:#fff;border:2.5px solid var(--canvas);
    box-shadow:0 0 0 2px var(--nodecolor),0 4px 10px rgba(0,0,0,.5);
    background:radial-gradient(circle at 50% 35%, color-mix(in srgb,var(--nodecolor) 55%, #11141a), #0d1014);
  }
  .card .role{font-weight:700;font-size:13.5px;line-height:1.25;color:#fff;margin-top:2px}
  .card .person{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.3}
  .card .vac{color:var(--red);font-size:10.5px;font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
  .card .deptband{position:absolute;top:0;left:0;right:0;height:4px;border-radius:14px 14px 0 0;background:var(--nodecolor)}

  /* collapse toggle */
  .toggle{
    position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:4px;background:var(--card-2);
    border:1.5px solid var(--line);color:var(--muted);border-radius:20px;padding:2px 9px;
    font-size:11px;font-weight:700;cursor:pointer;z-index:3;transition:.15s;
  }
  .toggle:hover{border-color:var(--nodecolor);color:#fff}
  .toggle .tchev{transition:.2s;display:inline-block;font-size:9px}
  li.collapsed > .card .toggle .tchev{transform:rotate(-90deg)}
  li.collapsed > .card .toggle{border-color:var(--nodecolor);color:#fff}

  /* zoom control */
  .zoombar{position:absolute;right:18px;bottom:18px;display:flex;align-items:center;gap:2px;
    background:#11141a;border:1px solid var(--line);border-radius:10px;padding:4px;z-index:25;box-shadow:var(--shadow)}
  .zoombar button{width:32px;height:30px;background:transparent;border:none;color:var(--text);font-size:17px;cursor:pointer;border-radius:7px}
  .zoombar button:hover{background:#1d212b;color:var(--red)}
  .zoombar .zlabel{min-width:46px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}

  .hint{position:absolute;left:18px;bottom:18px;color:#5b6675;font-size:11.5px;z-index:25;
    background:rgba(10,12,16,.7);padding:5px 10px;border-radius:8px;border:1px solid #1c2129}

  /* Detail drawer (dark) */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.2s;z-index:60}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:480px;max-width:92vw;z-index:70;
    background:#10131a;border-left:1px solid var(--line);box-shadow:var(--shadow);
    transform:translateX(105%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:22px 24px;border-bottom:1px solid var(--line);position:relative}
  .drawer-head .deptpill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:12px}
  .drawer-head h3{margin:0;font-size:20px;font-weight:800;color:#fff}
  .drawer-head .dperson{color:var(--muted);font-size:14px;margin-top:5px}
  .drawer-close{position:absolute;top:18px;right:18px;background:var(--card-2);border:1px solid var(--line);color:var(--text);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
  .drawer-close:hover{border-color:var(--red);color:var(--red)}
  .drawer-body{padding:8px 24px 28px;overflow-y:auto}
  .sec{margin-top:20px}
  .sec h4{margin:0 0 9px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
  .sec.neg h4{color:#ff6b66}
  .outcome{font-size:14px;line-height:1.5;color:var(--text);background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  ul.li{margin:0;padding-left:18px}
  ul.li li{font-size:13.5px;line-height:1.55;margin-bottom:7px;color:#c9d0db}
  ul.li li strong{color:#fff}
  .group{margin-bottom:10px}
  .group .gt{font-size:13px;font-weight:700;color:#fff;margin:12px 0 5px}

  @media(max-width:620px){.headpad{padding:14px 14px 12px}.stage{padding:36px 26px 100px}}
</style>
</head>
<body>

/* ---------- helpers ---------- */
function personCount(node){
  if(node.team||node.vacant) return 0;     // group nodes & open roles add no headcount
  if(node.indiv) return 1;
  const p=node.person||'';
  if(!p) return 0;
  let s=p.includes('—')?p.split('—')[1]:p; // drop company prefix (e.g. "Jummp Marketing —")
  const names=s.split('·').map(x=>x.trim()).filter(Boolean);
  return names.length||1;
}
function headcount(node){
  let n=0;
  (node.children||[]).forEach(c=>{ n+=personCount(c)+headcount(c); });
  return n;
}
function initials(node){
  if(node.team) return String((node.children||[]).length);
  if(node.vacant) return '?';
  let src=node.indiv?node.role:(node.person||'');
  if(src.includes('—')) src=src.split('—')[1]||src;
  const people=src.split('·').map(s=>s.trim()).filter(Boolean);
  if(people.length>1) return String(people.length);
  let name=(people[0]||node.role).replace(/\(.*?\)/g,'').replace(/\b(in-house|floater)\b/gi,'').trim();
  const parts=name.split(/\s+/).filter(Boolean);
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}

/* ---------- render tree ---------- */
function buildCard(node){
  const c=COLORS[node.dept];
  const card=document.createElement('div');
  card.className='card';
  card.style.setProperty('--nodecolor',c);
  card.innerHTML=`<div class="deptband"></div>
    <div class="avatar">${initials(node)}</div>
    <div class="role">${node.role}</div>`+
    (node.vacant?`<div class="vac">Open role</div>`:(node.person?`<div class="person">${node.person}</div>`:''));
  card.addEventListener('click',e=>{ if(e.target.closest('.toggle'))return; openDrawer(node); });
  return card;
}
function renderNode(node){
  const li=document.createElement('li');
  const card=buildCard(node);
  li.appendChild(card);
  const kids=node.children||[];
  if(kids.length){
    const tg=document.createElement('div');
    tg.className='toggle';
    tg.innerHTML=`<span class="tchev">▾</span><span>${headcount(node)}</span>`;
    tg.addEventListener('click',e=>{e.stopPropagation();li.classList.toggle('collapsed');});
    card.appendChild(tg);
    const ul=document.createElement('ul');
    kids.forEach(k=>ul.appendChild(renderNode(k)));
    li.appendChild(ul);
  }
  return li;
}
const stage=document.getElementById('stage');
const tree=document.createElement('ul');
tree.className='tree';
tree.appendChild(renderNode(TREE));
stage.appendChild(tree);

/* ---------- drawer ---------- */
const overlay=document.getElementById('overlay');
const drawer=document.getElementById('drawer');
function openDrawer(node){
  const c=COLORS[node.dept];
  const pill=document.getElementById('dPill');
  pill.textContent=DEPTNAME[node.dept];
  pill.style.background=c+'26';pill.style.color=c;
  document.getElementById('dTitle').textContent=node.role;
  document.getElementById('dPerson').innerHTML=node.vacant?'<span style="color:#ff6b66">Open role — to be filled</span>':(node.person||'');
  const head=document.querySelector('.drawer-head');
  head.style.borderTop='3px solid '+c;
  const body=document.getElementById('dBody');
  body.style.setProperty('--accent',c);
  body.innerHTML='';
  if(node.outcome) body.innerHTML+=`<div class="sec"><h4>Primary Outcome</h4><div class="outcome">${node.outcome}</div></div>`;
  if(node.responsibilities) body.innerHTML+=`<div class="sec"><h4>Responsibilities</h4><ul class="li">${node.responsibilities.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  if(node.groups){
    let g='<div class="sec">';
    node.groups.forEach(gr=>{g+=`<div class="group"><div class="gt">${gr.gt}</div><ul class="li">${gr.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;});
    body.innerHTML+=g+'</div>';
  }
  if(node.not) body.innerHTML+=`<div class="sec neg"><h4>Not Responsible For</h4><ul class="li">${node.not.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  if(node.note) body.innerHTML+=`<div class="sec"><div class="outcome" style="border-style:dashed;color:var(--muted)">${node.note}</div></div>`;
  overlay.classList.add('open');drawer.classList.add('open');
}
function closeDrawer(){overlay.classList.remove('open');drawer.classList.remove('open');}
overlay.addEventListener('click',closeDrawer);
document.getElementById('drawerClose').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});

/* ---------- expand / collapse all ---------- */
document.getElementById('expandAll').addEventListener('click',()=>{
  document.querySelectorAll('.tree li').forEach(l=>l.classList.remove('collapsed'));
});
document.getElementById('collapseAll').addEventListener('click',()=>{
  // collapse the four department nodes (direct children of root)
  document.querySelectorAll('.tree > li > ul > li').forEach(l=>{ if(l.querySelector('ul')) l.classList.add('collapsed'); });
});

/* ---------- pan ---------- */
const canvas=document.getElementById('canvas');
let drag=false,sx,sy,sl,st;
canvas.addEventListener('mousedown',e=>{
  if(e.target.closest('.card')||e.target.closest('.zoombar'))return;
  drag=true;sx=e.clientX;sy=e.clientY;sl=canvas.scrollLeft;st=canvas.scrollTop;canvas.classList.add('grabbing');
});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  canvas.scrollLeft=sl-(e.clientX-sx);
  canvas.scrollTop=st-(e.clientY-sy);
});
window.addEventListener('mouseup',()=>{drag=false;canvas.classList.remove('grabbing');});

/* ---------- zoom ---------- */
let z=1;
const zlabel=document.getElementById('zlabel');
function applyZoom(){stage.style.zoom=z;zlabel.textContent=Math.round(z*100)+'%';}
document.getElementById('zoomIn').addEventListener('click',()=>{z=Math.min(1.6,z+0.1);applyZoom();});
document.getElementById('zoomOut').addEventListener('click',()=>{z=Math.max(0.4,z-0.1);applyZoom();});
document.getElementById('zoomFit').addEventListener('click',()=>{z=1;applyZoom();centerView();});

/* center horizontally on load */
function centerView(){canvas.scrollLeft=(canvas.scrollWidth-canvas.clientWidth)/2;}
window.addEventListener('load',()=>{ setTimeout(centerView,60); });
</script>
</body>
</html>
